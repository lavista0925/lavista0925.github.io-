<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>서 한 샘</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        /* 상단 메뉴 */
        nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: #222;
            padding: 15px 0;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-size: 16px;
        }

        nav a:hover {
            color: #ffd700;
        }

        /* 각 페이지 영역 */
        section {
            max-width: 900px;
            margin: 0 auto;
            padding: 80px 20px;
            text-align: center;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        h2 {
            font-size: 30px;
            margin-bottom: 30px;
        }

        p {
            line-height: 1.8;
        }

        /* 메인 사진 */
        .main-image {
            width: 100%;
            max-width: 800px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

    /* 사진 갤러리 */
.gallery {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    width: 100%;
}

.gallery-main {
    grid-row: span 2;
}

.gallery-main img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.gallery-right {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
}

.gallery-right .top {
    grid-column: span 2;
}

.gallery-right img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.gallery img {
    border-radius: 0;
}

        /* 동영상 */
        video {
            width: 100%;
            max-width: 800px;
            border-radius: 12px;
        }

        /* 소개 영역 */
        .about {
            background-color: white;
            border-radius: 15px;
            padding: 30px;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #888;
        }
    </style>
</head>

<body>

    <!-- 상단 메뉴 -->
    <nav>
        <a href="#home">홈</a>
        <a href="#photos">사진</a>
        <a href="#videos">동영상</a>
        <a href="#about">소개</a>
    </nav>


    <!-- 홈 -->
    <section id="home">

        <h1>서 한 샘</h1>

        <p>
            Han Saem Seo
        </p>

        <img
            src="images/photo1.jpg"
            alt="메인 사진"
            class="main-image"
        >

    </section>


<!-- 사진 -->
<section id="photos">

    <h2>사진</h2>

    <div class="gallery">

        <!-- 왼쪽 큰 사진 -->
        <div class="gallery-main">
            <img src="images/photo1.jpg" alt="사진 1">
        </div>

        <!-- 오른쪽 사진 3장 -->
        <div class="gallery-right">

            <div class="top">
                <img src="images/photo2.jpg" alt="사진 2">
            </div>

            <div>
                <img src="images/myphoto.jpg" alt="사진 3">
            </div>

            <div>
                <img src="images/photo4.jpg" alt="사진 4">
            </div>

        </div>

    </div>

</section>


<!-- 동영상 -->
<section id="videos">

    <h2>동영상</h2>

    <iframe
        width="100%"
        height="450"
        src="https://www.youtube.com/embed/abFAD0EQsOg?autoplay=1&mute=1&loop=1&playlist=abFAD0EQsOg"
        title="YouTube 동영상"
        frameborder="0"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen>
    </iframe>

    <p>
        <a href="https://www.youtube.com/watch?v=abFAD0EQsOg"
           target="_blank"
           rel="noopener noreferrer">
            YouTube에서 영상 보기 ↗
        </a>
    </p>

</section>

    <!-- 소개 -->
    <section id="about">

        <h2>🍀</h2>

        <div class="about">

            <p>
                When life gives you a lemonade,
            </p>

            <p>
                make lemons.
            </p>

        </div>

    </section>


    <footer>
        © 2026 나의 홈페이지
    </footer>

</body>
</html>
