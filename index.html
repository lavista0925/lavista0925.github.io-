<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>서 한 샘</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        /* 상단 메뉴 */
        nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: #222;
            padding: 15px 0;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-size: 16px;
        }

        nav a:hover {
            color: #ffd700;
        }

        /* 각 페이지 영역 */
        section {
            max-width: 900px;
            margin: 0 auto;
            padding: 80px 20px;
            text-align: center;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        h2 {
            font-size: 30px;
            margin-bottom: 30px;
        }

        p {
            line-height: 1.8;
        }

        /* 메인 사진 */
        .main-image {
            width: 100%;
            max-width: 800px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

    /* 사진 갤러리 */
        
.gallery {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    width: 100%;
}

.gallery img {
    width: 100%;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    border-radius: 10px;
}
        /* 동영상 */
        video {
            width: 100%;
            max-width: 800px;
            border-radius: 12px;
        }

        /* YouTube 동영상 그리드 */
.youtube-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    width: 100%;
}

.youtube-grid iframe {
    width: 100%;
    aspect-ratio: 16 / 9;
    height: auto;
    border-radius: 12px;
}

/* 모바일 화면 */
@media (max-width: 600px) {
    .youtube-grid {
        grid-template-columns: 1fr;
    }
}
        /* 소개 영역 */
        .about {
            background-color: white;
            border-radius: 15px;
            padding: 30px;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #888;
        }
/* 추가 사진 2장 - 위아래 배치 */
.extra-photos {
    display: flex;
    flex-direction: column;
    gap: 20px;
    width: 100%;
    margin-top: 30px;
}

.extra-photos img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 10px;
}

/* 모바일 */
@media (max-width: 600px) {
    .extra-photos {
        grid-template-columns: 1fr;
    }

    .extra-photos img {
        height: auto;
    }
}
/* PHOTO - 원본 비율 유지 */
.full-grid-section {
    max-width: none;
    width: 100%;
    padding: 80px 0;
}

.photo-stack {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.photo-stack img {
    width: 100%;
    height: auto;
    display: block;
}
        /* PC - grid3, grid4 좌우 배치 */
.photo-pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    width: 100%;
}

.photo-pair img {
    width: 100%;
    height: auto;
    display: block;
}
        /* PC - grid3, grid4 좌우 배치 */
.photo-pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    width: 100%;
}

.photo-pair img {
    width: 100%;
    height: auto;
    display: block;
}
        
 /* 모바일 PHOTO */
@media (max-width: 600px) {

    .full-grid-section {
        padding: 50px 0;
    }

    .full-grid-section h2 {
        padding: 0 20px;
    }

    .photo-stack {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .photo-stack img {
        width: 100%;
        height: auto;
        display: block;
        object-fit: contain;
    }

    /* 모바일에서는 grid3, grid4를 다시 세로로 */
    .photo-pair {
        display: flex;
        flex-direction: column;
        gap: 4px;
        width: 100%;
    }

    .photo-pair img {
        width: 100%;
        height: auto;
        display: block;
    }
}
