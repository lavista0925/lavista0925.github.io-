<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MORE PHOTOS - 서 한 샘</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        /* 상단 메뉴 */
        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: #222;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-size: 16px;
        }

        nav a:hover {
            color: #d4af37;
        }

        /* 제목 */
        header {
            text-align: center;
            padding: 60px 20px 30px;
        }

        header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        header p {
            color: #777;
        }

        /* 사진 3 x 3 */
        .photo-grid {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .photo-grid img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            cursor: pointer;
            transition: 0.3s;
        }

        .photo-grid img:hover {
            opacity: 0.8;
            transform: scale(1.02);
        }

        /* 사진 확대 화면 */
        .modal {
            display: none;
            position: fixed;
            z-index: 200;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal img {
            max-width: 90%;
            max-height: 85%;
            object-fit: contain;
        }

        /* 닫기 버튼 */
        .close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            cursor: pointer;
        }

        .close:hover {
            color: #d4af37;
        }

        /* 모바일 */
        @media (max-width: 600px) {
            nav a {
                margin: 0 8px;
                font-size: 14px;
            }

            header h1 {
                font-size: 28px;
            }

            .photo-grid {
                grid-template-columns: repeat(2, 1fr);
                padding: 10px;
            }
        }
    </style>
</head>

<body>

    <!-- 상단 메뉴 -->
    <nav>
        <a href="index.html">HOME</a>
        <a href="photos.html">MORE PHOTOS</a>
    </nav>

    <!-- 제목 -->
    <header>
        <h1>MORE PHOTOS</h1>
        <p>서 한 샘</p>
    </header>

    <!-- 사진 9장 -->
    <div class="photo-grid">

        <img src="images/image1.jpg" alt="추가 사진 1" onclick="openModal(this)">
        <img src="images/image2.jpg" alt="추가 사진 2" onclick="openModal(this)">
        <img src="images/image3.jpg" alt="추가 사진 3" onclick="openModal(this)">
        <img src="images/image4.jpg" alt="추가 사진 4" onclick="openModal(this)">
        <img src="images/image5.jpg" alt="추가 사진 5" onclick="openModal(this)">
        <img src="images/image6.jpg" alt="추가 사진 6" onclick="openModal(this)">
        <img src="images/image7.jpg" alt="추가 사진 7" onclick="openModal(this)">
        <img src="images/image8.jpg" alt="추가 사진 8" onclick="openModal(this)">
        <img src="images/image9.jpg" alt="추가 사진 9" onclick="openModal(this)">

    </div>

    <!-- 확대 화면 -->
    <div class="modal" id="photoModal" onclick="closeModal()">

        <span class="close" onclick="closeModal()">✕</span>

        <img id="modalImage" src="" alt="확대 사진" onclick="event.stopPropagation()">

    </div>

    <script>
        function openModal(image) {
            const modal = document.getElementById("photoModal");
            const modalImage = document.getElementById("modalImage");

            modalImage.src = image.src;
            modal.style.display = "flex";
        }

        function closeModal() {
            document.getElementById("photoModal").style.display = "none";
        }
    </script>

</body>
</html>
